[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memty"
version = "0.2.1"
description = "Your AI memory, owned by you: one private, local vault for ChatGPT, Claude, Gemini, Claude Code, Codex, Cursor and any MCP client"
readme = "memty/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RohanNK86" }]
dependencies = ["mcp>=1.9,<2"]
keywords = ["memty", "ai-memory", "portable-memory", "local-first", "privacy", "mcp", "model-context-protocol",
            "llm", "chatgpt", "claude", "gemini", "perplexity", "browser-extension", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/memtylabs/memty"
Repository = "https://github.com/memtylabs/memty"
Documentation = "https://github.com/memtylabs/memty/tree/main/memty#readme"
Issues = "https://github.com/memtylabs/memty/issues"
Changelog = "https://github.com/memtylabs/memty/blob/main/memty/CHANGELOG.md"
Security = "https://github.com/memtylabs/memty/blob/main/SECURITY.md"

[project.optional-dependencies]
mongodb = ["pymongo>=4.6"]
crypto = ["cryptography>=43.0"]
mcp = []
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
memty = "memty.cli:main"
memtyd = "memty.runtime.daemon:main"
memty-mcp = "memty.integrations.mcp.server:main"
memty-legacy-vault = "memty.legacy.vault_cli:main"
memty-legacy-mcp = "memty.legacy.vault_mcp:main"
memty-api = "memty.legacy.api:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
# memty is split into subpackages (vault/, context/, integrations/, ...); find them all.
include = ["memty", "memty.*", "memoryport"]
exclude = ["memty.integrations.browser.extension*"]

[tool.setuptools.package-data]
# The Memty Bridge browser extension ships inside the wheel; `memty extension` installs it.
"memty.integrations.browser" = ["extension/*.js", "extension/*.json", "extension/*.html",
                                "extension/*.md", "extension/icons/*.png"]
