# Build, test and publish the memty package to PyPI with Trusted Publishing.
#
# Publishing uses OpenID Connect: there is no PyPI API token anywhere. PyPI
# trusts this exact workflow file (publish.yml) in memtylabs/memty, through
# the "pypi" environment. Every upload gets a PEP 740 provenance attestation
# that links the files on PyPI to the commit and workflow run that built them,
# and the PyPI page shows them as verified.
#
# Releasing:
#   1. Bump `version` in pyproject.toml and add the CHANGELOG entry (merged to main).
#   2. Create a GitHub release whose tag is "v" + that version (e.g. v0.2.1).
#   3. This workflow tests, builds and publishes it.
#
# Pull requests that touch the package run the test and build jobs only.

name: Publish to PyPI

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "memty/**"
      - "memoryport/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:  # dry run: test and build without publishing

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install memty
        run: python -m pip install -e .
      - name: Run the test suite (including the security suite when present)
        shell: bash
        run: |
          modules=$(ls tests/test_memty_*.py | sed -e 's#/#.#g' -e 's#\.py$##' | tr '\n' ' ')
          echo "Running: $modules"
          python -m unittest $modules -v

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version 'v$version'."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/memty --help > /dev/null
          /tmp/wheel-check/bin/python -c "import memty, pathlib; ext = pathlib.Path(memty.__file__).parent / 'integrations/browser/extension/manifest.json'; assert ext.is_file(), 'browser extension missing from wheel'"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only a published GitHub release uploads; pull requests and manual runs stop at build.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memty/
    permissions:
      id-token: write  # OIDC for Trusted Publishing and provenance attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish with provenance attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
